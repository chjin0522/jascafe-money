# 고객 홈 + 금액 앱 통합 코드

```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>인화카페 고객 관리</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#111827;
  color:white;
  padding:20px;
}

.container{
  width:100%;
  max-width:480px;
  margin:auto;
}

.card{
  background:#1f2937;
  border-radius:28px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.title{
  font-size:30px;
  font-weight:800;
  margin-bottom:20px;
}

.sub-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:16px;
}

input{
  width:100%;
  background:#111827;
  border:none;
  color:white;
  padding:16px;
  border-radius:16px;
  font-size:18px;
  outline:none;
}

button{
  border:none;
  cursor:pointer;
  transition:0.12s;
}

button:active{
  transform:scale(0.95);
}

.row{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.btn{
  flex:1;
  padding:16px;
  border-radius:16px;
  color:white;
  font-size:17px;
  font-weight:700;
}

.add-btn{
  background:#10b981;
}

.back-btn{
  background:#6b7280;
  margin-bottom:20px;
}

.customer-list{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.customer-item{
  background:#111827;
  padding:18px;
  border-radius:18px;
  font-size:18px;
  font-weight:700;
}

.balance-label{
  color:#9ca3af;
  font-size:14px;
}

.balance{
  font-size:42px;
  font-weight:800;
  margin:12px 0 24px;
}

.quick-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}

.quick-buttons button{
  padding:18px;
  border-radius:18px;
  color:white;
  font-size:18px;
  font-weight:700;
}

.minus{
  background:#ef4444;
}

.action-row{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.action-btn{
  flex:1;
  padding:18px;
  border-radius:18px;
  color:white;
  font-size:18px;
  font-weight:700;
}

.add-money-btn{
  background:#10b981;
}

.sub-btn{
  background:#ef4444;
}

.reset-btn{
  background:#6b7280;
}

.history{
  margin-top:24px;
}

.history-title{
  font-size:20px;
  font-weight:700;
}

.history-list{
  max-height:250px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:14px;
}

.item{
  background:#111827;
  padding:14px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
}

.green{
  color:#34d399;
  font-weight:700;
}

.red{
  color:#f87171;
  font-weight:700;
}

.hidden{
  display:none;
}

</style>
</head>

<body>

<div class="container">

  <!-- 홈 화면 -->
  <div class="card" id="homePage">

    <div class="title">☕ 인화카페 고객 관리</div>

    <input
      type="text"
      id="customerName"
      placeholder="고객 이름 입력"
    >

    <input
      type="text"
      id="customerPhone"
      placeholder="전화번호 입력"
      style="margin-top:12px;"
    >

    <div class="row">
      <button
        class="btn add-btn"
        onclick="addCustomer()"
      >
        고객 추가
      </button>
    </div>

    <input
      type="text"
      id="searchInput"
      placeholder="고객 검색"
      oninput="renderCustomers()"
      style="margin-top:18px;"
    >

    <div class="customer-list" id="customerList"></div>

  </div>

  <!-- 금액 앱 -->
  <div class="card hidden" id="moneyPage">

    <button
      class="btn back-btn"
      onclick="goHome()"
    >
      ← 홈으로
    </button>

    <div
      class="title"
      id="customerTitle"
    >
      고객 금액 앱
    </div>

    <div class="balance-label">현재 잔액</div>

    <div class="balance" id="balance">0원</div>

    <input
      type="number"
      id="display"
      placeholder="금액 입력"
    >

    <div class="quick-buttons">

      <button class="minus" onclick="quickMinus(500)">
        -500
      </button>

      <button class="minus" onclick="quickMinus(1000)">
        -1,000
      </button>

      <button class="minus" onclick="quickMinus(5000)">
        -5,000
      </button>

    </div>

    <div class="action-row">

      <button
        class="action-btn add-money-btn"
        onclick="addMoney()"
      >
        + 추가
      </button>

      <button
        class="action-btn sub-btn"
        onclick="subtractMoney()"
      >
        - 차감
      </button>

    </div>

    <div class="action-row">

      <button
        class="action-btn reset-btn"
        onclick="resetAll()"
      >
        초기화
      </button>

    </div>

    <div class="history">

      <div class="history-title">
        사용 내역
      </div>

      <div
        class="history-list"
        id="history"
      ></div>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyByzJi1Mr0amEhpdykeK41P8nF9-twRGYo",

  authDomain:
    "jascafe-money.firebaseapp.com",

  databaseURL:
    "https://jascafe-money-default-rtdb.asia-southeast1.firebasedatabase.app/",

  projectId: "jascafe-money",

  storageBucket:
    "jascafe-money.firebasestorage.app",

  messagingSenderId:
    "1031508679331",

  appId:
    "1:1031508679331:web:1ceac5cdd1a14293f83d16"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let customers = [];
let currentCustomer = "";
let money = 0;
let historyData = [];


const customersRef = ref(db, "customers");

onValue(customersRef, (snapshot)=>{

  const data = snapshot.val();

  if(!data){
    customers = [];
  }else{
    customers = Object.entries(data).map(([key, value])=>({
      id:key,
      name:value.name || "",
      phone:value.phone || ""
    }));
  }

  renderCustomers();

});

window.addCustomer = function(){

  const input = document.getElementById("customerName");

  const name = input.value.trim();

  const phone = document
    .getElementById("customerPhone")
    .value
    .trim();

  if(!name || !phone) return;

  const id = Date.now();

  const customerRef = ref(db, `customers/${id}`);

  set(customerRef, {
    name,
    phone,
    money:0,
    history:[]
  });

  input.value = "";

  document.getElementById("customerPhone").value = "";
};

window.renderCustomers = function(){

  const keyword = document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const list = document
    .getElementById("customerList");

  list.innerHTML = "";

  customers
    .filter(customer=>{

      return (
        customer.name
          .toLowerCase()
          .includes(keyword)
        ||
        customer.phone
          .includes(keyword)
      );

    })
    .forEach(customer=>{

      list.innerHTML += `
        <div
          class="customer-item"
          onclick="openCustomer('${customer.id}')"
        >
          <div>${customer.name}</div>
          <div style="font-size:14px;color:#9ca3af;margin-top:4px;">
            ${customer.phone}
          </div>
        </div>
      `;

    });
};

window.openCustomer = function(id){

  currentCustomer = id;
  window.currentCustomer = id;

  const customer = customers.find(
    item=>item.id == id
  );

  document
    .getElementById("homePage")
    .classList.add("hidden");

  document
    .getElementById("moneyPage")
    .classList.remove("hidden");

  document
    .getElementById("customerTitle")
    .innerText = `💰 ${customer.name} 금액 앱`;

 const moneyRef = ref(
  db,
  `customers/${id}/money`
);

const historyRef = ref(
  db,
  `customers/${id}/history`
);


onValue(moneyRef, (snapshot)=>{

  money = snapshot.val() || 0;

  updateUI();

});

onValue(historyRef, (snapshot)=>{
  const data = snapshot.val();

  if(!data){

    historyData = [];

  }else if(Array.isArray(data)){

    historyData = data;

  }else{

    historyData = Object.values(data);

  }

  renderHistory();

});
};

window.goHome = function(){

  document
    .getElementById("moneyPage")
    .classList.add("hidden");

  document
    .getElementById("homePage")
    .classList.remove("hidden");
};

function save(){

  if(!currentCustomer) return;

  const customer = customers.find(
    item => item.id == currentCustomer
  );

  set(
    ref(db, `customers/${currentCustomer}`),
    {

      name: customer?.name || "",

      phone: customer?.phone || "",

      money: money,

      history: historyData

    }
  );
}
function updateUI(){

  document.getElementById("balance")
    .innerText =
    money.toLocaleString() + "원";
}

window.addMoney = function(){

  const value = Number(
    document.getElementById("display").value
  );

  if(!value) return;

  money += value;

  addHistory("금액 추가", value, true);

  document.getElementById("display").value = "";

  save();
  updateUI();
};

window.subtractMoney = function(){

  const value = Number(
    document.getElementById("display").value
  );

  if(!value) return;

  money -= value;

  addHistory("금액 차감", value, false);

  document.getElementById("display").value = "";

  save();
  updateUI();
};

window.quickMinus = function(value){

  money -= value;

  addHistory("빠른 차감", value, false);

  save();
  updateUI();
};

window.resetAll = function(){

  if(confirm("초기화할까요?")){

    money = 0;
    historyData = [];

    save();

    updateUI();
    renderHistory();
  }
};

function addHistory(text, value, plus){

  const now = new Date();

  const time =
    now.getHours().toString().padStart(2,"0")
    + ":" +
    now.getMinutes().toString().padStart(2,"0");

  historyData.unshift({
    text,
    value,
    plus,
    time
  });

  if(historyData.length > 30){
    historyData.pop();
  }

  renderHistory();
}

function renderHistory(){

  const history =
    document.getElementById("history");

  history.innerHTML = "";

  historyData.forEach(item=>{

    history.innerHTML += `

      <div class="item">

        <div>
          <div>${item.text}</div>
          <small>${item.time}</small>
        </div>

        <div class="${item.plus ? 'green' : 'red'}">
          ${item.plus ? '+' : '-'}
          ${Number(item.value).toLocaleString()}원
        </div>

      </div>

    `;
  });
}

</script>

</body>
</html>
```
